<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>IsmoType — 人格与主义光谱测试</title>
    <style>
        /* ========== CSS Variables ========== */
        :root {
            --bg: #f7faf9;
            --card-bg: #ffffff;
            --text: #1e2b2a;
            --text-light: #4f5e5d;
            --text-muted: #7b8b89;
            --accent: #3b7a6e;
            --accent-light: #e8f0ee;
            --accent-dark: #2a5e54;
            --accent-glow: rgba(59, 122, 110, 0.25);
            --border: #d4e0dd;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --progress-bg: #e0eae7;
            --btn-hover: #2f6b5f;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --star-opacity: 0;
            --glow-opacity: 1;
            --controls-height: 72px;
        }

        body.dark-mode {
            --bg: #0f1412;
            --card-bg: #1a221f;
            --text: #dce6e2;
            --text-light: #a8b8b4;
            --text-muted: #7b8f8a;
            --accent: #6ba89a;
            --accent-light: #1e302b;
            --accent-dark: #8ed1bf;
            --accent-glow: rgba(107, 168, 154, 0.30);
            --border: #2a3d38;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --progress-bg: #2a3d38;
            --btn-hover: #529b87;
            --star-opacity: 1;
            --glow-opacity: 0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100dvh;
            transition: background 0.6s ease, color 0.6s ease;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* ========== 动态背景层 ========== */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .glow-spots {
            position: absolute; inset: 0;
            opacity: var(--glow-opacity);
            transition: opacity 1.2s ease;
            background:
                radial-gradient(circle at 15% 25%, rgba(59,122,110,0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(59,122,110,0.08) 0%, transparent 40%),
                radial-gradient(circle at 45% 55%, rgba(59,122,110,0.05) 0%, transparent 50%);
            background-size: 200% 200%;
            animation: floatGlow 25s ease-in-out infinite alternate;
        }
        @keyframes floatGlow {
            0% { background-position: 0% 0%; background-size: 200% 200%; }
            50% { background-position: 100% 50%; background-size: 180% 180%; }
            100% { background-position: 50% 100%; background-size: 220% 220%; }
        }
        .stars-container {
            position: absolute; inset: 0;
            opacity: var(--star-opacity);
            transition: opacity 1.2s ease;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            animation-delay: var(--delay);
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.7); }
            100% { opacity: 0.9; transform: scale(1.3); }
        }

        /* ========== 装饰圆圈 ========== */
        .orb {
            position: absolute;
            border-radius: 50%;
            border: 3px solid var(--accent);
            pointer-events: none;
            opacity: 0.12;
            animation: orbFloat var(--orb-duration, 12s) ease-in-out infinite alternate;
        }
        body.dark-mode .orb {
            opacity: 0.18;
            border-color: var(--accent);
        }

        .orb-1 {
            width: 320px; height: 320px;
            top: 5%; right: -8%;
            --orb-duration: 10s;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 200px; height: 200px;
            bottom: 15%; left: -10%;
            --orb-duration: 8s;
            animation-delay: 1s;
        }
        .orb-3 {
            width: 140px; height: 140px;
            top: 50%; left: -5%;
            --orb-duration: 9s;
            animation-delay: 0.5s;
        }
        .orb-4 {
            width: 100px; height: 100px;
            bottom: 30%; right: -3%;
            --orb-duration: 7s;
            animation-delay: 1.5s;
        }
        .orb-5 {
            width: 260px; height: 260px;
            top: 20%; left: 30%;
            --orb-duration: 11s;
            animation-delay: 2s;
            opacity: 0.06;
        }
        .orb-6 {
            width: 180px; height: 180px;
            bottom: 10%; right: 20%;
            --orb-duration: 9.5s;
            animation-delay: 0.8s;
            opacity: 0.08;
        }
        .orb-7 {
            width: 80px; height: 80px;
            top: 35%; right: 10%;
            --orb-duration: 6s;
            animation-delay: 2.5s;
            opacity: 0.15;
        }
        .orb-8 {
            width: 120px; height: 120px;
            bottom: 45%; left: 15%;
            --orb-duration: 7.5s;
            animation-delay: 1.8s;
            opacity: 0.10;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.10; }
            50% { transform: translate(25px, -35px) scale(1.2); opacity: 0.22; }
            100% { transform: translate(-15px, 25px) scale(0.85); opacity: 0.10; }
        }

        /* ========== 控制栏 ========== */
        #controlsBar {
            position: sticky; top: 12px; z-index: 100;
            max-width: 860px; width: 100%; margin: 0 auto;
            padding: 8px 20px 12px;
            display: flex; justify-content: flex-end; align-items: center; gap: 12px;
            background: transparent; pointer-events: none;
            flex-shrink: 0;
        }
        #controlsBar > * { pointer-events: auto; }

        #controlsBar .lang-btn,
        #controlsBar .theme-btn {
            width: 44px; height: 44px; border-radius: 50%;
            border: 1.5px solid var(--border);
            background: rgba(255,255,255,0.6);
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            user-select: none; touch-action: manipulation;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
        }
        body.dark-mode #controlsBar .lang-btn,
        body.dark-mode #controlsBar .theme-btn {
            background: rgba(20,28,25,0.75);
            border-color: var(--border);
        }
        #controlsBar .lang-btn:hover,
        #controlsBar .theme-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 28px rgba(0,0,0,0.10);
            border-color: var(--accent);
        }
        #controlsBar .lang-btn:active,
        #controlsBar .theme-btn:active { transform: scale(0.92); }
        #controlsBar .lang-btn { font-size: 1.5rem; line-height: 1; }
        #controlsBar .lang-btn.hidden { display: none; }
        #controlsBar .theme-btn { font-size: 1.2rem; }

        /* ========== 语言下拉菜单 ========== */
        #langMenu {
            display: none;
            position: absolute;
            top: 52px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            min-width: 160px;
            overflow: hidden;
            z-index: 101;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.88);
        }
        body.dark-mode #langMenu {
            background: rgba(20,28,25,0.88);
        }
        #langMenu .lang-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
            color: var(--text);
            border-bottom: 1px solid var(--border);
        }
        #langMenu .lang-menu-item:last-child { border-bottom: none; }
        #langMenu .lang-menu-item:hover { background: var(--accent-light); }
        #langMenu .lang-menu-item.active { background: var(--accent-light); font-weight: 600; }
        #langMenu .lang-menu-item .lang-menu-flag { font-size: 1.3rem; }
        #langMenu .lang-menu-item .lang-menu-check {
            margin-left: auto;
            color: var(--accent);
            font-weight: 700;
        }

        /* ========== Container ========== */
        .container {
            max-width: 860px; width: 100%; margin: 0 auto;
            padding: 0 20px 0;
            position: relative; z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ========== 主页英雄区 ========== */
        #home-hero {
            text-align: center;
            padding: 10px 0 10px;
            min-height: calc(100dvh - var(--controls-height) - 40px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 20px 0 10px;
        }

        .logo-svg {
            width: 80px; height: 80px; margin: 0 auto 8px; display: block;
            animation: logoSpin 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 20px rgba(59,122,110,0.15));
        }
        body.dark-mode .logo-svg {
            filter: drop-shadow(0 4px 20px rgba(107,168,154,0.20));
        }
        @keyframes logoSpin {
            from { transform: rotate(-180deg) scale(0.3); opacity: 0; }
            to { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        .hero-title {
            font-size: 3.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 60%, #5da892 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            line-height: 1.1;
            text-shadow: 0 0 60px rgba(59,122,110,0.08);
            position: relative;
        }
        body.dark-mode .hero-title {
            background: linear-gradient(135deg, #8ed1bf 0%, var(--accent) 50%, #5da892 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 2px;
            opacity: 0.5;
        }

        .hero-subtitle {
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--text-light);
            letter-spacing: 6px;
            margin-top: 14px;
            opacity: 0.85;
            position: relative;
            padding: 0 20px;
        }
        .hero-subtitle span {
            display: inline-block;
            animation: subtitleReveal 1.2s ease-out;
        }
        @keyframes subtitleReveal {
            from { opacity: 0; transform: translateY(12px); letter-spacing: 12px; }
            to { opacity: 0.85; transform: translateY(0); letter-spacing: 6px; }
        }

        .hero-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 20px auto 24px;
            opacity: 0.3;
            border-radius: 2px;
        }

        .hero-stats {
            display: flex; justify-content: center; gap: 56px; flex-wrap: wrap;
            margin: 4px 0 28px;
        }
        .hero-stats .stat {
            text-align: center;
            position: relative;
        }
        .hero-stats .stat::after {
            content: '';
            position: absolute;
            right: -28px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 32px;
            background: var(--border);
            opacity: 0.3;
        }
        .hero-stats .stat:last-child::after { display: none; }
        .hero-stats .stat .number {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--accent-dark);
            line-height: 1.1;
            letter-spacing: 2px;
            font-feature-settings: "tnum";
            transition: color 0.4s;
        }
        body.dark-mode .hero-stats .stat .number {
            color: var(--accent);
        }
        .hero-stats .stat .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 1.5px;
            font-weight: 300;
        }
        .hero-stats .stat .label-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 6px;
            opacity: 0.5;
            vertical-align: middle;
        }

        .btn {
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            text-align: center;
            touch-action: manipulation;
            min-height: 56px;
            min-width: 180px;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            box-shadow: 0 4px 24px rgba(59,122,110,0.30);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(59,122,110,0.40);
        }
        .btn-primary:active { transform: scale(0.95); }

        .hero-note {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 16px;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        /* ========== 英雄区底部（箭头） ========== */
        .hero-footer {
            margin-top: auto;
            padding-top: 4px;
            padding-bottom: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* ========== 滚动指示器（竖排双箭头，无按钮样式） ========== */
        .scroll-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            padding: 4px 0;
            background: transparent;
            border: none;
            outline: none;
            transition: opacity 0.3s ease;
        }
        .scroll-indicator:hover {
            opacity: 0.6;
        }
        .scroll-indicator .arrow-icon {
            font-size: 1.6rem;
            line-height: 0.5;
            margin: -6px 0;
            color: var(--accent);
            display: block;
            animation: arrowBounce 2.0s ease-in-out infinite;
        }
        .scroll-indicator .arrow-icon:nth-child(1) {
            animation-delay: 0s;
        }
        .scroll-indicator .arrow-icon:nth-child(2) {
            animation-delay: 0.3s;
        }
        @keyframes arrowBounce {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(8px); opacity: 1; }
        }

        .scroll-indicator .scroll-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .scroll-indicator:hover .scroll-text {
            opacity: 0.8;
        }

        /* ========== 页脚 ========== */
        .site-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 10px 20px 18px;
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
            transition: background 0.6s ease, color 0.6s ease;
            margin-top: 0;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }
        .site-footer span { opacity: 0.7; }

        /* ========== 介绍区域 (始终可见，自然滚动) ========== */
        #intro-section {
            display: block;
            padding: 40px 0 20px;
            margin-top: 10px;
            opacity: 1;
            transform: none;
            transition: none;
        }

        .intro-block {
            opacity: 1;
            transform: none;
            transition: none;
            margin-bottom: 48px;
        }
        .intro-block h2 {
            font-size: 1.8rem; color: var(--accent-dark); margin-bottom: 18px;
            text-align: center; font-weight: 600;
        }
        .intro-block p {
            color: var(--text-light); max-width: 680px;
            margin: 0 auto 16px; text-align: center; font-size: 1.05rem;
        }

        .home-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
            margin: 24px 0 16px;
        }
        .home-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px 20px; text-align: center;
            transition: all 0.3s ease; box-shadow: var(--shadow);
        }
        .home-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.06);
            border-color: var(--accent);
        }
        .home-card .icon { font-size: 2.4rem; margin-bottom: 12px; display: block; }
        .home-card h3 { font-size: 1.1rem; color: var(--accent-dark); margin-bottom: 6px; font-weight: 600; }
        .home-card p { font-size: 0.9rem; color: var(--text-light); margin: 0; line-height: 1.5; }

        .steps {
            display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
            margin: 24px 0 16px;
        }
        .step { flex: 0 1 200px; text-align: center; }
        .step-num {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--accent); color: #fff; font-size: 1.6rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px; transition: transform 0.3s;
        }
        .step:hover .step-num { transform: scale(1.08); }
        .step h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--text); }
        .step p { font-size: 0.9rem; color: var(--text-light); margin: 0; }

        .intro-cta { text-align: center; padding: 20px 0 30px; }
        .intro-cta .btn { min-width: 200px; }

        /* ========== 结果页 MBTI 图标居中 ========== */
        .summary-mbti-section img,
        .summary-mbti-section .fallback-icon {
            display: block;
            margin: 0 auto 12px;
        }

        /* ========== 答题界面 ========== */
        .question-section { min-height: 300px; display: flex; flex-direction: column; justify-content: center; padding: 10px 0; }
        .question-num { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .question-text { font-size: 1.35rem; font-weight: 500; margin-bottom: 32px; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 14px; }
        .option-btn {
            display: flex; align-items: center; padding: 16px 22px;
            border: 2px solid var(--border); border-radius: 14px;
            background: var(--card-bg); cursor: pointer;
            transition: all 0.2s ease; font-size: 1rem; color: var(--text);
            text-align: left; touch-action: manipulation; min-height: 56px;
        }
        .option-btn:hover { border-color: var(--accent); background: var(--accent-light); transform: translateX(6px); }
        .option-btn:active { transform: scale(0.97); }
        .option-btn.selected {
            border-color: var(--accent); background: var(--accent-light);
            font-weight: 600; box-shadow: 0 0 0 4px rgba(59,122,110,0.2);
            animation: pulseSelect 0.4s ease;
        }
        @keyframes pulseSelect {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .option-radio {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid var(--border); margin-right: 16px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all 0.25s;
        }
        .option-btn.selected .option-radio { border-color: var(--accent); background: var(--accent); }
        .option-btn.selected .option-radio::after {
            content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff;
        }
        .progress-bar-container {
            width: 100%; height: 8px; background: var(--progress-bg);
            border-radius: 6px; margin: 10px 0 24px; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.4s ease; width: 0%; }
        .nav-buttons {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 28px; gap: 16px; flex-wrap: wrap;
        }
        .btn-prev {
            background: transparent; border: 2px solid var(--border); color: var(--text);
            padding: 12px 28px; min-width: 120px; min-height: 48px;
            border-radius: 50px; font-weight: 500; cursor: pointer;
            transition: all 0.25s; font-size: 0.95rem;
        }
        .btn-prev:hover:not(:disabled) {
            background: var(--accent-light); border-color: var(--accent); transform: translateY(-2px);
        }
        .btn-prev:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .nav-hint { color: var(--text-muted); font-size: 0.85rem; text-align: center; flex: 1; }

        /* ========== 结果页 ========== */
        .result-title { text-align: center; font-size: 1.8rem; color: var(--accent-dark); margin-bottom: 30px; font-weight: 700; }
        .summary-mbti-section { text-align: center; margin-bottom: 30px; }
        .summary-mbti-type { font-size: 3rem; font-weight: 800; color: var(--accent-dark); letter-spacing: 4px; }
        .summary-isms-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px;

        .summary-ism-item {

        .summary-ism-item:hover { transform: translateY(-4px); border-color: var(--accent); }
        .summary-ism-item .fallback-icon,
        .summary-ism-item img { margin: 0 auto 8px; }
        .summary-ism-name { font-weight: 700; font-size: 0.95rem; color: var(--accent-dark); }

        .report-section { margin-top: 40px; border-top: 2px solid var(--border); padding-top: 32px; }
        .report-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; color: var(--accent-dark); text-align: center; }
        .spectrum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
        .spectrum-item {
            background: var(--card-bg); border-radius: 14px; padding: 18px 16px;
            border: 1px solid var(--border); transition: box-shadow 0.3s;
        }
        .spectrum-item:hover { box-shadow: var(--shadow); }
        .spectrum-labels { display: flex; justify-content: space-between; font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
        .spectrum-bar {
            display: flex; height: 14px; border-radius: 8px; overflow: visible;
            margin-bottom: 8px; gap: 4px;
        }
        .spectrum-fill { height: 100%; border-radius: 8px; transition: width 1s ease; }
        .spectrum-gap { width: 4px; flex-shrink: 0; }
        .spectrum-percents { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-light); }
        .spectrum-detail-toggle {
            margin-top: 10px; color: var(--accent); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; display: inline-block; transition: opacity 0.2s;
        }
        .spectrum-detail-toggle:hover { opacity: 0.7; }
        .dim-desc-content {
            margin-top: 10px; font-size: 0.85rem; color: var(--text-light); line-height: 1.6;
            padding: 12px; background: var(--accent-light); border-radius: 10px; display: none;
        }
        .dim-desc-content p { margin-bottom: 4px; }
        .radar-container { display: flex; justify-content: center; margin: 16px 0 20px; }
        canvas.radar-chart {
            max-width: 100%; height: auto;
            background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border);
        }
        .rank-table-toggle {
            display: inline-block; margin: 10px 0 16px; color: var(--accent); cursor: pointer;
            font-weight: 600; font-size: 0.95rem; padding: 6px 16px; border-radius: 30px;
            background: var(--accent-light); transition: all 0.2s; border: none;
        }
        .rank-table-toggle:hover { background: var(--border); transform: translateY(-2px); }
        .rank-table { display: none; width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 8px; }
        .rank-table.visible { display: table; animation: fadeUp 0.4s ease; }
        .rank-table th { text-align: left; padding: 10px 14px; background: var(--accent-light); font-weight: 600; border-bottom: 2px solid var(--border); }
        .rank-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .restart-btn { margin-top: 40px; text-align: center; }

        .fallback-icon {
            border-radius: 12px; background: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; flex-shrink: 0; border: 1px solid var(--border);

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }

        .status-message { text-align: center; padding: 60px 20px; animation: fadeUp 0.5s ease; }
        .status-message .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }

        /* ========== 移动端适配 ========== */

            .home-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
            .home-card { padding: 20px 14px; }

    <!-- ===== 动态背景层 ===== -->
    <div class="bg-layer">

        <div class="stars-container" id="starsContainer"></div>
    </div>

    <!-- ===== 装饰圆圈 ===== -->

    <div class="orb orb-2"></div>

    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
    <div class="orb orb-7"></div>
    <div class="orb orb-8"></div>

    <!-- ===== 控制栏 ===== -->
    <div id="controlsBar">
        <div style="position:relative;">
            <button class="lang-btn" id="langToggle" aria-label="切换语言">🇨🇳</button>
            <div id="langMenu">
                <!-- 由 JS 动态填充 -->
            </div>
        </div>
        <button class="theme-btn" id="themeToggle" aria-label="切换日夜模式" onclick="window.toggleTheme?.()">☀️</button>
    </div>

    <div class="container" id="app">
        <p style="text-align:center;padding:40px;">加载中，请稍候…</p>

        <span>IsmoType v2.3 · 人格与主义光谱测试 · © 2026 LI_SparrowC1</span>
    </footer>

    <script>
        // ==========================================
        // 动态星星生成
        // ==========================================
        (function initStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1 + Math.random() * 3;
                star.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--duration:${2+Math.random()*4}s;--delay:${Math.random()*5}s;`;
                container.appendChild(star);
            }
        })();

        // ==========================================
        // 主题控制
        // ==========================================
        (function initTheme() {
            let manualTheme = null;
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            function apply(dark) {
                document.body.classList.toggle('dark-mode', dark);
                const btn = document.getElementById('themeToggle');
                if (btn) btn.textContent = dark ? '🌙' : '☀️';
            }
            function resolve() { return manualTheme || (mq.matches ? 'dark' : 'light'); }
            function refresh() { apply(resolve() === 'dark'); }
            window.toggleTheme = function() {
                manualTheme = resolve() === 'dark' ? 'light' : 'dark';
                refresh();
            };
            mq.addEventListener('change', () => { if (manualTheme === null) refresh(); });
            refresh();
        })();

        // ==========================================
        // 语言切换占位
        // ==========================================
        window.handleLangToggle = function() {
            console.warn('语言切换逻辑尚未加载 (main.js)');
        };
        console.log('✅ index.html v2.3 加载完成，等待 main.js 接管');
    </script>

    <script src="data.js"></script>
    <script src="main.js"></script>
