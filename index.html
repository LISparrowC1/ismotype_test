<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsmoType — 人格与主义光谱测试</title>
    <style>
        /* ========== 变量 ========== */
        :root {
            --bg: #f9f7f3;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --text-light: #6b6b6b;
            --accent: #4a8c7e;
            --accent-light: #e8f4f1;
            --accent-dark: #2f5e54;
            --border: #e0dcd5;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --radius: 16px;
            --progress-bg: #e8e4dc;
            --btn-hover: #3a7266;
            --bg-spot: rgba(74,140,126,0.08);
            --star-opacity: 0;
            --toggle-bg: #e8f4f1;
            --toggle-icon: '☀️';
        }
        body.dark-mode {
            --bg: #1a1d20;
            --card-bg: #252830;
            --text: #e0e0e0;
            --text-light: #a0a0a0;
            --accent: #6bb5a4;
            --accent-light: #2a3b36;
            --accent-dark: #8ed1bf;
            --border: #3a3f44;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --progress-bg: #3a3f44;
            --btn-hover: #529b87;
            --bg-spot: rgba(107,181,164,0.15);
            --star-opacity: 1;
            --toggle-bg: #3a3f44;
            --toggle-icon: '🌙';
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.4s, color 0.4s;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景 */
        .light-spots {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events: none;
            background:
                radial-gradient(circle at 15% 25%, rgba(74,140,126,0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(74,140,126,0.12) 0%, transparent 40%),
                radial-gradient(circle at 55% 40%, rgba(74,140,126,0.08) 0%, transparent 40%);
            opacity: 1;
            transition: opacity 0.4s;
        }
        body.dark-mode .light-spots { opacity: 0; }
        .starfield {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events: none;
            background:
                radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 60% 30%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 75% 55%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 90% 20%, rgba(255,255,255,0.6), transparent);
            opacity: var(--star-opacity);
            transition: opacity 0.8s;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed; top: 24px; right: 24px; z-index: 999;
            width: 44px; height: 44px; border-radius: 50%; background: var(--toggle-bg);
            border: none; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1); transition: all 0.3s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .container {
            max-width: 800px; width: 100%; background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 40px 36px; margin: 20px 0;
            position: relative; z-index: 1; transition: background 0.4s, box-shadow 0.4s;
        }
        .container.animate-in { animation: fadeInUp 0.6s ease-out; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

        header { text-align: center; margin-bottom: 30px; }
        .logo-svg { width: 60px; height: 60px; margin: 0 auto 12px; display: block; animation: logoSpin 1s ease-out; }
        @keyframes logoSpin { from { transform: rotate(-180deg) scale(0.5); opacity:0; } to { transform: rotate(0deg) scale(1); opacity:1; } }
        h1 { font-size: 2rem; font-weight: 700; color: var(--accent-dark); letter-spacing: -0.5px; }
        .subtitle { color: var(--text-light); font-size: 1rem; margin-top: 4px; }

        /* 滚动主页样式 */
        .home-section { padding: 60px 0; text-align: center; opacity: 0; transform: translateY(30px); transition: opacity 0.6s, transform 0.6s; }
        .home-section.visible { opacity: 1; transform: translateY(0); }
        .home-section h2 { font-size: 1.8rem; margin-bottom: 16px; color: var(--accent-dark); }
        .home-section p { max-width: 500px; margin: 0 auto 20px; color: var(--text-light); line-height: 1.7; }
        .home-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 30px 0; }
        .home-card { background: var(--accent-light); border-radius: 12px; padding: 24px; transition: transform 0.2s; }
        .home-card:hover { transform: translateY(-4px); }
        .home-card .icon { font-size: 2rem; margin-bottom: 12px; }
        .home-card h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--accent-dark); }
        .home-card p { font-size: 0.9rem; color: var(--text-light); }
        .steps { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin: 30px 0; }
        .step { flex: 0 0 200px; text-align: center; }
        .step-num { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
        .step h3 { font-size: 1.1rem; margin-bottom: 6px; }
        .step p { font-size: 0.85rem; color: var(--text-light); }

        .btn { padding: 12px 28px; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.25s; }
        .btn-primary { background: var(--accent); color: white; position: relative; overflow: hidden; }
        .btn-primary::after { content: ''; position: absolute; top:0; left:-100%; width:100%; height:100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.4s; }
        .btn-primary:hover::after { left: 100%; }
        .btn-primary:hover { background: var(--btn-hover); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(74,140,126,0.3); }

        .progress-bar-container { width: 100%; height: 8px; background: var(--progress-bg); border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }
        .question-section { min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
        .question-num { font-size: 0.9rem; color: var(--text-light); margin-bottom: 8px; }
        .question-text { font-size: 1.3rem; font-weight: 500; margin-bottom: 30px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            display: flex; align-items: center; padding: 14px 20px;
            border: 2px solid var(--border); border-radius: 12px; background: var(--card-bg);
            cursor: pointer; transition: all 0.2s ease; font-size: 1rem; color: var(--text); text-align: left;
        }
        .option-btn:hover { border-color: var(--accent); background: var(--accent-light); transform: translateX(4px); }
        .option-btn.selected { border-color: var(--accent); background: var(--accent-light); font-weight: 600; box-shadow: 0 0 0 3px rgba(74,140,126,0.25); animation: pulse 0.4s; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .option-radio {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
            margin-right: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .option-btn.selected .option-radio { border-color: var(--accent); background: var(--accent); }
        .option-btn.selected .option-radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn-prev { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-prev:hover { background: var(--accent-light); border-color: var(--accent); transform: translateY(-2px); }

        .summary-mbti-section { text-align: center; margin-bottom: 30px; }
        .summary-mbti-img { width: 120px; height: 120px; border-radius: 24px; object-fit: cover; margin-bottom: 12px; }
        .summary-mbti-type { font-size: 3rem; font-weight: 800; color: var(--accent-dark); letter-spacing: 4px; }
        .summary-isms-grid { display: grid; grid-template-columns: repeat(3,1fr); gap:20px; margin-bottom:20px; }
        .summary-ism-item { text-align: center; background: var(--accent-light); border-radius: 16px; padding:16px 8px; transition: transform 0.2s; }
        .summary-ism-item:hover { transform: translateY(-4px); }
        .summary-ism-item img { width:56px; height:56px; border-radius:12px; object-fit:cover; margin-bottom:8px; }
        .summary-ism-name { font-weight:700; font-size:1rem; color:var(--accent-dark); }
        .report-section { margin-top:40px; border-top:1px solid var(--border); padding-top:30px; }
        .report-title { font-size:1.4rem; font-weight:700; margin-bottom:20px; color:var(--accent-dark); text-align:center; }
        .spectrum-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:20px; }
        .spectrum-item { background:var(--card-bg); border-radius:12px; padding:16px; border:1px solid var(--border); }
        .spectrum-labels { display:flex; justify-content:space-between; font-weight:700; font-size:1rem; margin-bottom:8px; }
        .spectrum-bar { display:flex; height:12px; border-radius:6px; overflow:visible; margin-bottom:8px; gap:4px; }
        .spectrum-fill { height:100%; border-radius:6px; transition: width 1s; }
        .spectrum-gap { width:4px; background:transparent; flex-shrink:0; }
        .spectrum-percents { display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-light); }
        .spectrum-detail-toggle { margin-top:8px; color:var(--accent); font-weight:600; font-size:0.85rem; cursor:pointer; }
        .spectrum-detail-toggle:hover { text-decoration:underline; }
        .dim-desc-content { margin-top:8px; font-size:0.85rem; color:var(--text-light); line-height:1.5; }
        .radar-container { display:flex; justify-content:center; margin-bottom:20px; }
        canvas.radar-chart { max-width:100%; height:auto; }
        .rank-table-toggle { display:inline-block; margin:10px 0 20px; color:var(--accent); cursor:pointer; font-weight:600; font-size:0.95rem; }
        .rank-table-toggle:hover { text-decoration:underline; }
        .rank-table { display:none; width:100%; border-collapse:collapse; font-size:0.9rem; margin-top:10px; }
        .rank-table.visible { display:table; }
        .rank-table th { text-align:left; padding:8px 12px; background:var(--accent-light); font-weight:600; border-bottom:2px solid var(--border); }
        .rank-table td { padding:8px 12px; border-bottom:1px solid var(--border); }
        .restart-btn { margin-top:30px; text-align:center; }
        footer { text-align:center; color:var(--text-light); font-size:0.8rem; margin-top:20px; padding-bottom:20px; position:relative; z-index:1; }

        @media (max-width:600px) {
            .container { padding:24px 16px; }
            h1 { font-size:1.5rem; }
            .home-grid { grid-template-columns: 1fr; }
            .steps { flex-direction: column; align-items: center; }
            .spectrum-grid { grid-template-columns:1fr; }
            .summary-isms-grid { grid-template-columns: repeat(3,1fr); gap:10px; }
        }
    </style>
</head>
<body>
    <!-- 动态背景层 -->
    <div class="light-spots"></div>
    <div class="starfield"></div>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换日夜模式" onclick="toggleTheme()">☀️</button>

    <div class="container animate-in" id="app">
        <p style="text-align:center;padding:40px;">加载中，请稍候…</p>
    </div>
    <footer>IsmoType v1.3 · 人格与主义光谱测试 · © 2026 LI_SparrowC1</footer>

    <script>
        // 主题控制：跟随系统，手动可覆盖（仅会话）
        let manualTheme = null; // 'dark' | 'light' | null
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme(dark) {
            if (dark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            updateToggleIcon();
        }

        function getSystemTheme() {
            return mediaQuery.matches ? 'dark' : 'light';
        }

        function resolveTheme() {
            return manualTheme || getSystemTheme();
        }

        function refreshTheme() {
            applyTheme(resolveTheme() === 'dark');
        }

        function updateToggleIcon() {
            const btn = document.getElementById('themeToggle');
            if (btn) {
                btn.textContent = resolveTheme() === 'dark' ? '🌙' : '☀️';
            }
        }

        window.toggleTheme = function() {
            const current = resolveTheme();
            manualTheme = current === 'dark' ? 'light' : 'dark';
            refreshTheme();
        };

        // 系统主题变化时，如果用户未手动设置，则自动跟随
        mediaQuery.addEventListener('change', () => {
            if (manualTheme === null) {
                refreshTheme();
            }
        });

        // 初始应用
        refreshTheme();
    </script>

    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
